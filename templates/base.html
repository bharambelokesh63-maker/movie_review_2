<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Movie Review Analyzer — sentiment analysis, opinion mining, NLP tools for movie reviews.">
  <title>{% block title %}Movie Review Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-dot"></span>ReviewLens
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleNav()">&#9776;</button>
    <nav id="navlinks">
      <a href="{{ url_for('home') }}">Analyze</a>
      <a href="{{ url_for('batch') }}">Batch</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('nlp_lab') }}">NLP Lab</a>
      <a href="{{ url_for('evaluate') }}">Evaluation</a>
    </nav>
  </header>

  <main class="container">
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>

  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <p>Analyzing — please wait</p>
  </div>

  <footer class="footer">
    Movie Review Analyzer &amp; Opinion Mining &nbsp;&middot;&nbsp; Sentiment engine: {{ engine }}<br>
    Results are automatic estimates and describe only the text you provide.
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
